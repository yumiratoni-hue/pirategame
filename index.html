<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelayaran Pixel - Endless Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas tempat game digambar -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- UI untuk Skor dan Game Over -->
        <div id="ui">
            <p>Jarak: <span id="score">0</span> mil</p>
        </div>
        <div id="game-over-screen" style="display: none;">
            <h1>KAPAL KARAM!</h1>
            <p>Tekan [SPASI] atau Ketuk untuk Mengulang</p>
        </div>

        <!-- Instruksi di bawah layar -->
        <div id="instructions">
            Gunakan panah Kiri/Kanan atau A/D untuk mengemudi.
        </div>
    </div>

    <!-- Menghubungkan logika game -->
    <script src="game.js"></script>
</body>
</html>
