<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Pirate: SUPERMEGA EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #050b14, #1b263b);
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            font-size: 20px;
            color: #ffcc00;
            text-shadow: 3px 3px #ff0055, 0 0 15px #ffcc00;
            margin-bottom: 5px;
            text-align: center;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            width: 700px;
            margin-bottom: 8px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #415a77;
        }
        select, button {
            background: #1b4f72;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 4px;
            cursor: pointer;
            outline: none;
        }
        select:hover, button:hover {
            background: #2874a6;
        }
        #game-container {
            position: relative;
            border: 6px solid #ffcc00;
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.7), inset 0 0 20px rgba(0,0,0,0.8);
            border-radius: 4px;
            background: #000;
        }
        canvas {
            display: block;
        }
        #ui {
            margin-top: 10px;
            font-size: 9px;
            color: #00ffcc;
            text-align: center;
            text-shadow: 1px 1px #000;
        }
    </style>
</head>
<body>

    <h1 id="ui-title">PIRATE ESCAPE: SUPERMEGA</h1>
    
    <div id="top-bar">
        <div>
            <span id="ui-settings-label">Lang:</span>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en" selected>English</option>
                <option value="id">Indonesian</option>
                <option value="es">Spanish</option>
                <option value="ja">Japanese</option>
            </select>
        </div>
        <div>
            <span id="ui-mode-label">Mode:</span>
            <button id="modeBtn" onclick="toggleBossMode()">KRAKEN: OFF</button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="450"></canvas>
    </div>
    
    <div id="ui">Controls: <b id="ui-keys">LEFT/RIGHT to move | SPACE to shoot Cannon</b></div>

    <script>
        const translations = {
            en: {
                title: "PIRATE ESCAPE: SUPERMEGA",
                settingsLabel: "Lang:",
                modeLabel: "Boss Mode:",
                krakenOff: "KRAKEN: OFF",
                krakenOn: "KRAKEN: SUPERMEGA ON!",
                controls: "Controls: <b>LEFT/RIGHT to move | SPACE to shoot Cannon</b>",
                score: "SCORE",
                health: "HP",
                gameOver: "SUPERMEGA DEFEAT!",
                restart: "Press ENTER to Play Again"
            },
            id: {
                title: "PELARIAN BAJAK LAUT: SUPERMEGA",
                settingsLabel: "Bahasa:",
                modeLabel: "Mode Boss:",
                krakenOff: "KRAKEN: MATI",
                krakenOn: "KRAKEN: SUPERMEGA AKTIF!",
                controls: "Kontrol: <b>KIRI/KANAN untuk gerak | SPASI untuk Tembak Meriam</b>",
                score: "SKOR",
                health: "NYAWA",
                gameOver: "KEKALAHAN SUPERMEGA!",
                restart: "Tekan ENTER untuk Main Lagi"
            },
            es: {
                title: "HUÍDA PIRATA: SUPERMEGA",
                settingsLabel: "Idioma:",
                modeLabel: "Modo Jefe:",
                krakenOff: "KRAKEN: APAGADO",
                krakenOn: "KRAKEN: ¡SUPERMEGA ENCENDIDO!",
                controls: "Controles: <b>IZQ/DER para mover | ESPACIO para Disparar</b>",
                score: "PUNTAJE",
                health: "VIDA",
                gameOver: "¡DERROTA SUPERMEGA!",
                restart: "Presiona ENTER para Jugar de Nuevo"
            },
            ja: {
                title: "海賊の脱出：スーパーメガ",
                settingsLabel: "言語:",
                modeLabel: "ボスモード:",
                krakenOff: "クラーケン: オフ",
                krakenOn: "クラーケン: スーパーメガ オン！",
                controls: "操作: <b>左右で移動 | スペースで大砲発射</b>",
                score: "スコア",
                health: "体力",
                gameOver: "スーパーメガ敗北！",
                restart: "エンターキーを押してリトライ"
            }
        };

        let currentLang = "en";
        let bossModeActive = false;

        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById("ui-title").innerText = translations[lang].title;
            document.getElementById("ui-settings-label").innerText = translations[lang].settingsLabel;
            document.getElementById("ui-mode-label").innerText = translations[lang].modeLabel;
            document.getElementById("ui").innerHTML = translations[lang].controls;
            updateModeButtonText();
        }

        function toggleBossMode() {
            bossModeActive = !bossModeActive;
            updateModeButtonText();
        }

        function updateModeButtonText() {
            const btn = document.getElementById("modeBtn");
            btn.innerText = bossModeActive ? translations[currentLang].krakenOn : translations[currentLang].krakenOff;
            btn.style.borderColor = bossModeActive ? "#ff0055" : "#ffcc00";
            btn.style.color = bossModeActive ? "#ff0055" : "#ffcc00";
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let playerHealth = 3;
        let isGameOver = false;
        let particles = [];
        let backgroundStars = [];

        for(let i=0; i<60; i++) {
            backgroundStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 70,
            width: 40,
            height: 50,
            speed: 6,
            dx: 0
        };

        let obstacles = [];
        let coins = [];
        let bullets = [];

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") player.dx = -player.speed;
            if (e.key === "ArrowRight" || e.key === "d") player.dx = player.speed;
            if (e.key === " " && !isGameOver) {
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y,
                    width: 6,
                    height: 12,
                    speed: 8
                });
            }
            if (e.key === "Enter" && isGameOver) resetGame();
        });

        window.addEventListener("keyup", (e) => {
            if ((e.key === "ArrowLeft" || e.key === "a") && player.dx < 0) player.dx = 0;
            if ((e.key === "ArrowRight" || e.key === "d") && player.dx > 0) player.dx = 0;
        });

        function createExplosion(x, y, color) {
            for(let i=0; i<12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 30
                });
            }
        }

        function spawnObjects() {
            let spawnRateObs = bossModeActive ? 0.04 : 0.02;
            let spawnRateCoin = bossModeActive ? 0.02 : 0.03;

            if (Math.random() < spawnRateObs) {
                obstacles.push({
                    x: Math.random() * (canvas.width - 40),
                    y: -50,
                    width: 40,
                    height: 40,
                    speed: (bossModeActive ? 4 : 2.5) + Math.random() * 3,
                    hp: bossModeActive ? 2 : 1
                });
            }
            if (Math.random() < spawnRateCoin) {
                coins.push({
                    x: Math.random() * (canvas.width - 25),
                    y: -25,
                    width: 25,
                    height: 25,
                    speed: 2.5
                });
            }
        }

        function update() {
            if (isGameOver) return;

            backgroundStars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < obstacles[i].x + obstacles[i].width &&
                        bullets[j].x + bullets[j].width > obstacles[i].x &&
                        bullets[j].y < obstacles[i].y + obstacles[i].height &&
                        bullets[j].y + bullets[j].height > obstacles[i].y
                    ) {
                        createExplosion(obstacles[i].x + 20, obstacles[i].y + 20, "#ff5733");
                        obstacles[i].hp--;
                        bullets.splice(j, 1);
                        if (obstacles[i].hp <= 0) {
                            obstacles.splice(i, 1);
                            score += 50;
                            break;
                        }
                    }
                }

                if (!obstacles[i]) continue;

                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    createExplosion(player.x + 20, player.y + 20, "#ff0055");
                    playerHealth--;
                    obstacles.splice(i, 1);
                    if (playerHealth <= 0) isGameOver = true;
                } else if (obstacles[i] && obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].y += coins[i].speed;

                if (
                    player.x < coins[i].x + coins[i].width &&
                    player.x + player.width > coins[i].x &&
                    player.y < coins[i].y + coins[i].height &&
                    player.y + player.height > coins[i].y
                ) {
                    createExplosion(coins[i].x + 10, coins[i].y + 10, "#ffcc00");
                    coins.splice(i, 1);
                    score += 100;
                } else if (coins[i].y > canvas.height) {
                    coins.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].dx;
                particles[i].y += particles[i].dy;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            spawnObjects();
        }

        function drawPixelRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
        }

        function draw() {
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, "#0a192f");
            grad.addColorStop(1, "#172a45");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            backgroundStars.forEach(star => {
                ctx.fillStyle = bossModeActive ? "rgba(255, 0, 85, 0.6)" : "rgba(255, 255, 255, 0.4)";
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            ctx.fillStyle = bossModeActive ? "rgba(255, 0, 85, 0.2)" : "rgba(0, 255, 204, 0.15)";
            ctx.fillRect(0, (Date.now() / 80) % canvas.height, canvas.width, 15);

            drawPixelRect(player.x + 14, player.y - 10, 12, 15, "#00ffcc");
            drawPixelRect(player.x + 16, player.y, 8, 40, "#adb5bd");
            drawPixelRect(player.x, player.y + 15, 40, 35, "#c0392b");
            drawPixelRect(player.x + 5, player.y + 40, 30, 8, "#d4ac0d");

            bullets.forEach(b => {
                drawPixelRect(b.x, b.y, b.width, b.height, "#00ffcc");
            });

            obstacles.forEach(obs => {
                if (bossModeActive) {
                    drawPixelRect(obs.x, obs.y, obs.width, obs.height, "#8e44ad");
                    drawPixelRect(obs.x + 10, obs.y + 10, 20, 20, "#e74c3c");
                } else {
                    drawPixelRect(obs.x, obs.y, obs.width, obs.height, "#2c3e50");
                    drawPixelRect(obs.x + 8, obs.y + 12, 24, 18, "#7f8c8d");
                    drawPixelRect(obs.x + 15, obs.y + 16, 10, 10, "#e74c3c");
                }
            });

            coins.forEach(coin => {
                drawPixelRect(coin.x + 6, coin.y, 13, 25, "#f1c40f");
                drawPixelRect(coin.x + 3, coin.y + 6, 19, 13, "#f39c12");
            });

            particles.forEach(p => {
                drawPixelRect(p.x, p.y, p.size, p.size, p.color);
            });

            ctx.fillStyle = "#ffcc00";
            ctx.font = "11px 'Press Start 2P'";
            ctx.fillText(translations[currentLang].score + ": " + score, 20, 35);

            ctx.fillStyle = "#ff0055";
            let hearts = "";
            for(let h=0; h<playerHealth; h++) hearts += "♥ ";
            ctx.fillText(translations[currentLang].health + ": " + hearts, canvas.width - 200, 35);

            if (isGameOver) {
                ctx.fillStyle = "rgba(5, 11, 20, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff0055";
                ctx.font = "16px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText(translations[currentLang].gameOver, canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = "#ffcc00";
                ctx.font = "10px 'Press Start 2P'";
                ctx.fillText(translations[currentLang].score + ": " + score, canvas.width / 2, canvas.height / 2 + 10);

                ctx.fillStyle = "#00ffcc";
                ctx.font = "9px 'Press Start 2P'";
                ctx.fillText(translations[currentLang].restart, canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = "left";
            }
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            playerHealth = 3;
            obstacles = [];
            coins = [];
            bullets = [];
            particles = [];
            player.x = canvas.width / 2 - 20;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
